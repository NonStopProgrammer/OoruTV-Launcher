name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;34.0.0 platforms;android-34"

      - name: Build OoruTV.apk
        # No config.properties here: the build uses config.example.properties (no TMDB key, New York) and signs with
        # a throwaway key. Build on your own machine for your city, your key and your signing key.
        run: ./build.sh

      - name: Check the APK
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging OoruTV.apk | head -5
          unzip -l OoruTV.apk | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: OoruTV
          path: OoruTV.apk
          retention-days: 30

      - name: Publish as the "latest" pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest OoruTV.apk --prerelease --target "$GITHUB_SHA" --title "Latest build" --notes \
            "Built automatically from ${GITHUB_SHA::7}. This APK has no TMDB key (no picks: build your own with your key, see README) and is signed with a throwaway key, so it can't update an OoruTV you built yourself."
